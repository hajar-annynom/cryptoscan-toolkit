[project]
name = "cryptoscan-toolkit"
version = "0.1.0"
description = "Async CLI scanner auditing TLS/SSL and SSH cryptographic configuration"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0", "paramiko>=3.4", "rich>=13.7", "jinja2>=3.1"]

[project.optional-dependencies]
pdf = ["weasyprint>=61.0"]

[project.scripts]
cryptoscan = "cryptoscan.cli.main:main"

[tool.setuptools.packages.find]
include = ["cryptoscan*"]

[tool.setuptools.package-data]
"cryptoscan.report" = ["templates/*.j2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
